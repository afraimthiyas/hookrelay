services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "src/migrate.js"]
    environment: &env
      DATABASE_URL: postgres://hookrelay:hookrelay@postgres:5432/hookrelay
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY:-dev-api-key-change-me}
      ALLOW_PRIVATE_URLS: "true" # local dev only: lets you target services on your machine
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["node", "src/server.js"]
    environment: *env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
